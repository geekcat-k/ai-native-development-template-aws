name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    # ブランチ作成・コミット・Push・PR作成のため書き込み権限を付与する。
    # デプロイ用のAWS認証情報は渡さない。デプロイは利用者が main を指定して手動実行する。
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1
        # GH_TOKENを上書きしない。標準のGITHUB_TOKENで作ったPRはCIを起動しないため、
        # アクションが使うClaude GitHub Appのトークンに任せる。
        # 認証はどちらか一方のSecretだけを登録する。両方あるとAPIキー（従量課金）が優先される。
        # CLAUDE_CODE_OAUTH_TOKEN: Pro/Maxプランの利用枠で動かす（`claude setup-token`で発行）。
        # ANTHROPIC_API_KEY: Claude ConsoleのAPI従量課金で動かす。
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # PR作成とローカル検証に必要なコマンドを許可する。
          claude_args: >-
            --allowedTools "Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(pnpm verify)"
