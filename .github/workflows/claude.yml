name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    # ブランチ作成・コミット・Push・PR作成のため書き込み権限を付与する。
    # デプロイ用のAWS認証情報は渡さない。デプロイは利用者が main を指定して手動実行する。
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1
        # GH_TOKENを上書きしない。標準のGITHUB_TOKENで作ったPRはCIを起動しないため、
        # アクションが使うClaude GitHub Appのトークンに任せる。
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # PR作成とローカル検証に必要なコマンドを許可する。
          claude_args: >-
            --allowedTools "Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(pnpm verify)"
