name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    # ブランチ作成・コミット・Push・PR作成のため書き込み権限を付与する。
    # デプロイ用のAWS認証情報は渡さない。デプロイは利用者が main を指定して手動実行する。
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.14.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1
        # GH_TOKENを上書きしない。標準のGITHUB_TOKENで作ったPRはCIを起動しないため、
        # アクションが使うClaude GitHub Appのトークンに任せる。
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # PR作成とローカル検証に必要なコマンドを許可する。
          claude_args: >-
            --allowedTools "Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(pnpm verify)"
