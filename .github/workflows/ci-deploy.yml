name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: '本番AWSへデプロイする（mainのみ）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Show repository IDs for AWS setup
        if: github.event_name == 'workflow_dispatch'
        run: |
          printf 'GitHubOwner=%s\n' "$GITHUB_REPOSITORY_OWNER"
          printf 'GitHubOwnerId=%s\n' "$GITHUB_REPOSITORY_OWNER_ID"
          printf 'GitHubRepo=%s\n' "${GITHUB_REPOSITORY#*/}"
          printf 'GitHubRepoId=%s\n' "$GITHUB_REPOSITORY_ID"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      # 同一アカウントに複数プロジェクトを置く場合はRepository variablesのSTACK_NAMEで変える
      STACK_NAME: ${{ vars.STACK_NAME || 'AiWebStarterStack' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: CDK bootstrap（未実施の場合のみ）
        run: |
          if ! aws cloudformation describe-stacks --stack-name CDKToolkit > /dev/null 2>&1; then
            pnpm --filter @starter/infra exec cdk bootstrap aws://${{ vars.AWS_ACCOUNT_ID }}/${{ vars.AWS_REGION }} --cloudformation-execution-policies arn:aws:iam::aws:policy/AdministratorAccess
          fi
      - name: Deploy infrastructure
        run: pnpm cdk:deploy
      - name: Seed sample item once
        run: |
          TABLE=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SampleTableName'].OutputValue" --output text)
          EXISTING=$(aws dynamodb get-item --table-name "$TABLE" --key '{"id":{"S":"hello"}}' --query 'Item.id.S' --output text)
          if [ "$EXISTING" = "None" ]; then
            aws dynamodb put-item --table-name "$TABLE" --item '{"id":{"S":"hello"},"message":{"S":"Hello from DynamoDB"}}' --condition-expression 'attribute_not_exists(id)'
          fi
      - name: Publish site
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SiteBucketName'].OutputValue" --output text)
          DISTRIBUTION=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          pnpm --filter @starter/web build
          aws s3 sync apps/web/dist/ "s3://$BUCKET/" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/*'
      - name: Show site URL
        run: aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue" --output text
