name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: '本番AWSへデプロイする（mainのみ）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # 同じPRへ続けてpushしたら古い検証を止め、最新のコミットだけを検証する（Actionsの利用時間を減らすため）。
    # mainへのpushと手動実行（デプロイ）は止めないよう、PR以外は実行ごとに別のグループにする。
    concurrency:
      group: verify-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Show repository IDs for AWS setup
        if: github.event_name == 'workflow_dispatch'
        run: |
          printf 'GitHubOwner=%s\n' "$GITHUB_REPOSITORY_OWNER"
          printf 'GitHubOwnerId=%s\n' "$GITHUB_REPOSITORY_OWNER_ID"
          printf 'GitHubRepo=%s\n' "${GITHUB_REPOSITORY#*/}"
          printf 'GitHubRepoId=%s\n' "$GITHUB_REPOSITORY_ID"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 変更ファイルを調べるため、pushの前のコミットまで取得する。
          fetch-depth: 0
      - name: Detect docs-only changes
        id: changes
        # 手動実行（デプロイ）では、変更内容にかかわらずすべて検証する。
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        # 変更がドキュメントのMarkdownだけなら、型チェック・テスト・ビルドなどを省略する。
        # 対象はdocs/直下・docs/decisions/・tasks/・リポジトリ直下のMarkdownだけ。アプリ内のMarkdownは対象にしない。
        # テストやビルドがdocs/などのMarkdownを読むようにした場合は、そのファイルを対象から外すこと。
        # 差分を取得できない場合や変更ファイルがない場合は、すべて検証する。
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            # PRではマージ結果をcheckoutしているため、1つ目の親（マージ先）との差分がPRの変更になる。
            BASE='HEAD^1'
          else
            BASE="$BEFORE_SHA"
          fi
          # リネーム（移動）は移動先しか出力されないため、--no-renamesで移動元（削除）も出力する。
          if ! git diff --name-only --no-renames "$BASE" HEAD > "$RUNNER_TEMP/changed.txt"; then
            echo '変更ファイルを取得できないため、すべて検証します。'
            exit 0
          fi
          NON_DOCS=$(grep -vE '^(docs/([^/]+|decisions/[^/]+)|tasks/.+|[^/]+)\.md$' "$RUNNER_TEMP/changed.txt" || true)
          if [ -s "$RUNNER_TEMP/changed.txt" ] && [ -z "$NON_DOCS" ]; then
            echo '::notice::ドキュメントのMarkdownだけの変更のため、pnpm verify を省略します。'
            echo 'docs_only=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.changes.outputs.docs_only != 'true'
        with:
          version: 10.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.docs_only != 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.docs_only != 'true'
      - run: pnpm verify
        if: steps.changes.outputs.docs_only != 'true'

  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      # 同一アカウントに複数プロジェクトを置く場合はRepository variablesのSTACK_NAMEで変える
      STACK_NAME: ${{ vars.STACK_NAME || 'AiWebStarterStack' }}
      # 独自ドメインで公開する場合だけ3つすべて設定する（docs/TEMPLATE_SETUP.md 参照）
      CUSTOM_DOMAIN_NAME: ${{ vars.CUSTOM_DOMAIN_NAME }}
      HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
      CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Check application stack name
        run: |
          BOOTSTRAP_ROLE=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='DeployRoleArn'].OutputValue | [0]" --output text 2>/dev/null) || BOOTSTRAP_ROLE=''
          if [ -n "$BOOTSTRAP_ROLE" ] && [ "$BOOTSTRAP_ROLE" != 'None' ]; then
            echo '::error::STACK_NAMEがGitHub OIDC初期設定用スタックを指しています。STACK_NAMEを削除するか、別のアプリ用スタック名を指定してください。'
            exit 1
          fi
      - name: CDK bootstrap（未実施の場合のみ）
        run: |
          if ! aws cloudformation describe-stacks --stack-name CDKToolkit > /dev/null 2>&1; then
            pnpm --filter @starter/infra exec cdk bootstrap aws://${{ vars.AWS_ACCOUNT_ID }}/${{ vars.AWS_REGION }} --cloudformation-execution-policies arn:aws:iam::aws:policy/AdministratorAccess
          fi
      - name: Deploy infrastructure
        run: pnpm cdk:deploy
      - name: Seed sample item once
        run: |
          TABLE=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SampleTableName'].OutputValue" --output text)
          EXISTING=$(aws dynamodb get-item --table-name "$TABLE" --key '{"id":{"S":"hello"}}' --query 'Item.id.S' --output text)
          if [ "$EXISTING" = "None" ]; then
            aws dynamodb put-item --table-name "$TABLE" --item '{"id":{"S":"hello"},"message":{"S":"Hello from DynamoDB"}}' --condition-expression 'attribute_not_exists(id)'
          fi
      - name: Publish site
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SiteBucketName'].OutputValue" --output text)
          DISTRIBUTION=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          pnpm --filter @starter/web build
          aws s3 sync apps/web/dist/ "s3://$BUCKET/" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/*'
      - name: Show site URL
        run: aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue" --output text
