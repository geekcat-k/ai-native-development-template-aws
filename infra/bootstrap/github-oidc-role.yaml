AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions用OIDC Providerと初期デプロイロール
Parameters:
  GitHubOwner:
    Type: String
    Description: GitHubのユーザー名または組織名
  GitHubOwnerId:
    Type: String
    Description: GitHub所有者のアカウントID
  GitHubRepo:
    Type: String
    Description: このテンプレートから作ったリポジトリ名
  GitHubRepoId:
    Type: String
    Description: このテンプレートから作ったリポジトリのID
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: 同一AWSアカウントにGitHub OIDC Providerが既にあればfalse
Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']
Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:ref:refs/heads/main'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
    Description: GitHub Actions変数AWS_DEPLOY_ROLE_ARNに設定
